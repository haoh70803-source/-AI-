name: content-center-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: content_center_test
      POSTGRES_USER: content_center_test
      POSTGRES_PASSWORD: content_center_test
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content_center_test -d content_center_test"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_test_data:/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9003"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9003:9003"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - minio_test_data:/data

volumes:
  postgres_test_data:
  redis_test_data:
  minio_test_data:
